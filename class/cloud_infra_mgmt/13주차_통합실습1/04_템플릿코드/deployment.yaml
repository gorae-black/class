apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: web
          image: {DOCKERHUB_ID}/chatbot:latest # 본인 Docker Hub 계정명으로 바꾸세요
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
spec:
  type: NodePort
  selector:
    app: chatbot
  ports:
    - port: 80
      targetPort: 5000
